<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shape Recreations</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="index.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">

  <section>
    <h2 >Blobs</h2>

      <div class="blob blob-shape position-relative" style="width:100px; height:100px;">
        <div class="dot-drop position-absolute" style="width:20px; height:20px; top:30px; left:20px;"></div>
        <div class="position-absolute rounded-circle bg-primary" style="width:20px; height:20px; top:30px; left:50px;"></div>
      </div>

      <div class="blob blob-shape position-relative" style="width:300px; height:300px;">
        <div class="dot-drop position-absolute" style="width:50px; height:50px; top:60px; left:100px;"></div>
        <div class="position-absolute rounded-circle bg-primary" style="width:70px; height:70px; top:50px; left:170px;"></div>
      </div>

      <div class="blob blob-shape position-relative" style="width:150px; height:150px;">
        <div class="dot-drop position-absolute" style="width:20px; height:20px; top:40px; left:30px;"></div>
        <div class="position-absolute rounded-circle bg-primary" style="width:30px; height:30px; top:35px; left:60px;"></div>
      </div>

      <div class="blob blob-shape position-relative" style="width:100px; height:100px;">
        <div class="dot-drop position-absolute" style="width:20px; height:20px; top:30px; left:20px;"></div>
        <div class="position-absolute rounded-circle bg-primary" style="width:20px; height:20px; top:30px; left:50px;"></div>
      </div>

    </div>
  </section>

  <section>
    <h2>Database Icon</h2>
    <div class="position-relative" style="width:250px; height:200px;">
      <div class="db-bar rounded position-absolute" style="width:200px; height:90px; left:50px; top:0;"></div>
      <div class="db-bar rounded position-absolute" style="width:200px; height:90px; left:50px; bottom:0;"></div>
      <div class="db-divider position-absolute" style="width:200px; height:10px; left:50px; top:95px;"></div>
      <div class="db-circle rounded-circle position-absolute" style="width:100px; height:100px; left:20px; top:50px;"></div>
    </div>
  </section>



  <section >
    <h2 >Loading Spinner</h2>
    <div class="loader-wrap position-relative d-flex align-items-center justify-content-center" style="width:300px; height:300px;">
      <div class="loader-square position-absolute" style="width:150px; height:150px;"></div>
      <span class="position-relative">Loading</span>

    </div>
  </section>

</div>

</body>
</html>
