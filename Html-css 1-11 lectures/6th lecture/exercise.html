<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="exercise.css">w
    <title>Document</title>
</head>
<body>
    <div class="parent_box">
        <div class="child_box" style="background-color: cyan; display: flex; justify-content: flex-start; align-items: flex-start;">
            <div class="small_box" style="background-color: grey;"></div>
            <div class="small_box" style="background-image: url('images.png'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center;"></div>
        </div>

        <div class="child_box" style="background-image: url('random image.png'); background-size: cover; background-position: center; display: flex; align-items: flex-end;">
            <p style="position: absolute; top: 15px; left: 0; width: 100%; text-align: center;">background img</p>
            <div class="small_box" style="background-color: grey;"></div>
            <div class="small_box" style="background-color: orange;"></div>
            <div class="small_box" style="background-color: pink;"></div>
        </div>

        <div class="child_box" style="background: linear-gradient(to right, teal, darkcyan); display: flex; justify-content: space-between; align-items: center;">
            <div class="small_box" style="background-color: grey;"></div>
            <p style="position: absolute; left: 0; width: 100%; text-align: center; margin: 0; background-image: linear-gradient(to right, red, blue);">gradient</p>
            <div class="small_box" style="background-color: purple;"></div>
        </div>
    </div>
</body>
</html>
